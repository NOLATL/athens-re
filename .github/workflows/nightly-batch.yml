name: Nightly Batch

on:
  schedule:
    - cron: '0 8 * * *'   # 8am UTC = 4am ET (runs daily, finishes by ~6am ET)
  workflow_dispatch:       # allow manual trigger from GitHub Actions UI
  workflow_run:            # auto-run after every successful backend deploy
    workflows: ["Deploy Backend"]
    types: [completed]

jobs:
  trigger-batch:
    # Skip if triggered by a failed backend deploy
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Trigger nightly batch on Azure
        run: |
          response=$(curl -s -o /tmp/batch_response.txt -w "%{http_code}" \
            -X POST \
            -H "X-Batch-Secret: ${{ secrets.BATCH_SECRET }}" \
            "https://athens-re-avgqcah6hufjhdbx.westus2-01.azurewebsites.net/api/internal/run-batch")

          body=$(cat /tmp/batch_response.txt)
          echo "HTTP status: $response"
          echo "Response body: $body"

          if [ "$response" = "202" ]; then
            echo "Batch started successfully."
          elif [ "$response" = "409" ]; then
            echo "Batch already running — skipping."
          else
            echo "ERROR: Unexpected status $response"
            exit 1
          fi
