# Deploy Flask backend to Azure App Service (Python 3.11 on Linux)
#
# Required GitHub Secrets:
#   AZURE_WEBAPP_NAME          — your App Service name (e.g. "athens-re-api")
#   AZURE_WEBAPP_PUBLISH_PROFILE — contents of the .PublishSettings file from
#                                  Azure Portal → App Service → Get publish profile
#
# One-time Azure setup:
#   1. Create App Service: Python 3.11 | Linux | B1 tier (or F1 free)
#   2. Set startup command in Configuration → General settings:
#        gunicorn --bind=0.0.0.0:8000 --workers=2 --timeout=120 backend.api.app:app
#   3. Set App Settings (Configuration → Application settings):
#        DATABASE_URL      sqlite:///home/site/wwwroot/backend/db/real_estate.db
#        CENSUS_API_KEY    <your key if you have one>
#   4. Download publish profile and paste into GitHub secret

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'App_Data/**'
      - 'requirements.txt'
      - 'startup.txt'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate requirements.txt
        run: pip install -r requirements.txt --quiet

      - name: Cancel any in-progress Kudu deployment
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          # Extract SCM credentials from the publish profile XML
          SCM_URL=$(echo "$PUBLISH_PROFILE" | grep -oP 'publishUrl="\K[^"]+' | grep scm | head -1)
          USER=$(echo "$PUBLISH_PROFILE" | grep -oP 'userName="\K[^"]+' | head -1)
          PASS=$(echo "$PUBLISH_PROFILE" | grep -oP 'userPWD="\K[^"]+' | head -1)
          if [ -z "$SCM_URL" ]; then
            echo "Could not parse SCM URL — skipping cancellation"
            exit 0
          fi
          echo "Checking for in-progress deployments at $SCM_URL..."
          # Poll until no deployment is in-progress (status 0=pending,1=building,2=deploying)
          for i in $(seq 1 10); do
            STATUS=$(curl -s -u "$USER:$PASS" "https://$SCM_URL/api/deployments/latest" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',4))" 2>/dev/null || echo "4")
            echo "Deployment status: $STATUS"
            if [ "$STATUS" -ge 3 ]; then
              echo "No in-progress deployment — proceeding."
              break
            fi
            echo "Deployment in progress, waiting 15s (attempt $i/10)..."
            sleep 15
          done

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
